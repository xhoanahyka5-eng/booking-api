<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignalR Notification Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 24px;
            background: #f7f7f9;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        h1 {
            margin-top: 0;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            font-size: 15px;
            box-sizing: border-box;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 8px;
        }

        .connect-btn {
            background: #16a34a;
            color: white;
        }

        .disconnect-btn {
            background: #dc2626;
            color: white;
        }

        .status {
            margin-top: 12px;
            font-weight: bold;
        }

        .log {
            background: #111827;
            color: #e5e7eb;
            padding: 14px;
            border-radius: 10px;
            min-height: 180px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .notif {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            background: #f9fafb;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>SignalR Notification Test</h1>

        <label><strong>Access Token</strong></label>
        <input id="token" type="text" placeholder="Paste guest access token here" />

        <label style="display:block; margin-top:12px;"><strong>Base URL</strong></label>
        <input id="baseUrl" type="text" value="https://localhost:7260" />

        <button class="connect-btn" onclick="connectToHub()">Connect</button>
        <button class="disconnect-btn" onclick="disconnectFromHub()">Disconnect</button>

        <div class="status" id="status">Disconnected</div>
    </div>

    <div class="card">
        <h2>Debug Log</h2>
        <div class="log" id="log"></div>
    </div>

    <div class="card">
        <h2>Received Notifications</h2>
        <div id="notifications"></div>
    </div>

    <script>
        let connection = null;

        function log(message) {
            const logBox = document.getElementById("log");
            logBox.textContent += message + "\n";
            console.log(message);
        }

        function setStatus(text) {
            document.getElementById("status").textContent = text;
        }

        async function connectToHub() {
            try {
                const token = document.getElementById("token").value.trim();
                const baseUrl = document.getElementById("baseUrl").value.trim().replace(/\/$/, "");
                const hubUrl = `${baseUrl}/hubs/notifications`;

                if (!token) {
                    log("No token provided.");
                    setStatus("Disconnected");
                    return;
                }

                if (typeof signalR === "undefined") {
                    log("signalR library did not load.");
                    setStatus("Connection failed");
                    return;
                }

                if (connection) {
                    await connection.stop();
                    connection = null;
                }

                log("Connecting to: " + hubUrl);

                connection = new signalR.HubConnectionBuilder()
                    .withUrl(hubUrl, {
                        accessTokenFactory: () => token
                    })
                    .withAutomaticReconnect()
                    .build();

                connection.on("ReceiveNotification", (data) => {
                    log("LIVE NOTIFICATION RECEIVED: " + JSON.stringify(data));

                    const container = document.getElementById("notifications");
                    const item = document.createElement("div");
                    item.className = "notif";
                    item.innerHTML = `
                <strong>${data.title ?? "Notification"}</strong><br>
                <div>${data.message ?? ""}</div>
                <small>Type: ${data.type ?? ""}</small><br>
                <small>CreatedAt: ${data.createdAt ?? ""}</small>
              `;
                    container.prepend(item);
                });

                connection.onreconnecting(() => {
                    setStatus("Reconnecting...");
                    log("Reconnecting...");
                });

                connection.onreconnected(() => {
                    setStatus("Connected");
                    log("Reconnected successfully.");
                });

                connection.onclose((err) => {
                    setStatus("Disconnected");
                    log("Connection closed. " + (err ? err.toString() : ""));
                });

                await connection.start();
                setStatus("Connected");
                log("Connected successfully.");
            } catch (err) {
                setStatus("Connection failed");
                log("ERROR: " + err);
            }
        }

        async function disconnectFromHub() {
            try {
                if (connection) {
                    await connection.stop();
                    connection = null;
                }
                setStatus("Disconnected");
                log("Disconnected manually.");
            } catch (err) {
                log("Disconnect error: " + err);
            }
        }

        window.addEventListener("error", function (e) {
            log("WINDOW ERROR: " + e.message);
        });
    </script>
</body>
</html>
